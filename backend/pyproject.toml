[project]
name = "taxhub-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["sqlalchemy[asyncio]>=2.0,<2.1", "alembic>=1.14,<2", "asyncpg>=0.30,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
